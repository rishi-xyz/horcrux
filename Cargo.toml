[package]
name = "horcrux"
version = "0.1.0"
edition = "2024"
description = "Shamir's Secret Sharing split, encrypted shard storage, and key reconstruction for EVM signing."
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
k256 = "0.13"
rand = "0.8"
rpassword = "7"
thiserror = "2"
vsss-rs = "5.4.0"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
