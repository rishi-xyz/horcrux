[package]
name = "horcrux"
version = "0.1.0"
edition = "2024"
description = "Offline Threshold Key Management System for Blockchain Private Keys"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
alloy = { version = "2.3", features = ["k256", "providers", "reqwest-rustls-tls", "signer-local"] }
alloy-signer-local = { version = "2.3", features = ["zeroize"] }
anyhow = "1"
argon2 = "0.5"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
k256 = "0.13"
rand = "0.8"
rpassword = "7"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
vsss-rs = "5.4.0"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
